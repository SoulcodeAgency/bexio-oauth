name: Release

# release-please opens/updates the release PR on every push to main. When that
# PR is merged, it tags the release; `verify` re-runs every check on the tag
# and packs the tarball, and `publish` ships exactly that tarball to npm.
# All jobs live in this one file on purpose: a separate "on: release" workflow
# would never fire for a release created by automation, and npm's trusted
# publisher is bound to this filename (see docs/development.md §5.3).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Skips cleanly until the automation App is configured for this repo.
    if: vars.SC_AUTOMATION_CLIENT_ID != ''
    outputs:
      release_created: ${{ steps.release.outputs['packages/bexio-oauth--release_created'] }}
      tag_name: ${{ steps.release.outputs['packages/bexio-oauth--tag_name'] }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SC_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.SC_AUTOMATION_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Tests and packs with no publishing rights, so a compromised dev dependency
  # running during `npm ci` or the tests can't publish anything.
  verify:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      # No package-manager cache in release builds (npm's provenance guidance).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # setup-node caches automatically when package.json has packageManager.
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      # What ships is what was tested: the full check on the tagged commit.
      - run: npm run check
      - run: node scripts/check-pack.mjs
      - run: mkdir -p dist-pack && npm pack -w @soulcode/bexio-oauth --pack-destination dist-pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: dist-pack/*.tgz
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; pinned so the publisher is reproducible.
      - run: npm install -g npm@11.15.0
      # No checkout, no `npm ci`: only the verified tarball is published.
      - run: npm publish ./*.tgz --access public
