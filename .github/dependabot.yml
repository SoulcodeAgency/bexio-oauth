version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 10
    # Runtime deps of the published package → fix(deps) → patch release.
    # Everything else (dev deps, examples) → chore(deps) → no release.
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    # Supply-chain protection for routine updates; security updates skip this.
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Zurich
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
